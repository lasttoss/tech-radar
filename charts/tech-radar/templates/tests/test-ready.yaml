apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tech-radar.fullname" . }}-test-image
  labels:
    {{- include "tech-radar.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: radar
      image: {{ include "tech-radar.image" . }}
      # The test asserts the thing that matters most about this image: it produces a
      # digest from the fixtures inside it, with no network and no token.
      args:
        - "--items"
        - "testdata/fixtures/items-scan-2026-09.json"
        - "--limit"
        - "2"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
