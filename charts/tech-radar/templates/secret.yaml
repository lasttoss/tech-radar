{{- if and (not .Values.telegram.existingSecret) (or .Values.telegram.botToken .Values.github.token) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tech-radar.fullname" . }}
  labels:
    {{- include "tech-radar.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.telegram.botToken }}
  TELEGRAM_BOT_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.telegram.chatId }}
  TELEGRAM_CHAT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.github.token }}
  GITHUB_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
